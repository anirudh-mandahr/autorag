services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: autorag
      POSTGRES_PASSWORD: autorag
      POSTGRES_DB: autorag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autorag -d autorag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
