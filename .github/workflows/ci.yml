name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: Format, types, and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups --extra faiss

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy src

      - name: Offline tests with coverage
        env:
          OPENROUTER_API_KEY: ""
          VECTOR_BACKEND: faiss
        run: uv run pytest --cov=autorag --cov-report=term-missing --cov-fail-under=80
